# Publie le portfolio sur GitHub Pages à chaque mise à jour de la branche main,
# et chaque matin (derniers posts Instagram).
# Le site est compilé ici (npm run build → dossier out/) : seul le site final
# est mis en ligne, jamais le code source.
#
# Prérequis (une seule fois) : Settings → Pages → Source : « GitHub Actions ».
name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Chaque matin (≈ 6 h 17, heure de Bruxelles) : le site est republié pour afficher les
  # derniers posts Instagram (flux Behold lu une seule fois par publication). Les photos
  # déjà préparées sont reprises du cache : la publication ne prend que quelques minutes.
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - id: pages
        uses: actions/configure-pages@v5

      - name: Installer les dépendances
        run: npm ci

      # Versions web des photos (AVIF, WebP, JPEG à télécharger) : gardées d'une
      # publication à l'autre. Seules les photos nouvelles ou modifiées sont encodées
      # (la toute première publication prend une quinzaine de minutes).
      - name: Restaurer les versions web des photos
        uses: actions/cache@v4
        with:
          path: public/_photos
          key: photos-${{ hashFiles('Dossier photos*/**', 'public/images/**', 'scripts/photos.mjs', 'src/data/albums.ts', 'src/config/site.ts') }}
          restore-keys: photos-

      - name: Compiler le site
        run: npm run build
        env:
          # Adresse et sous-dossier fournis par GitHub Pages (ou votre domaine personnalisé).
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Formulaire de contact (EmailJS) : Settings → Secrets and variables → Actions → Variables.
          NEXT_PUBLIC_EMAILJS_SERVICE_ID: ${{ vars.EMAILJS_SERVICE_ID }}
          NEXT_PUBLIC_EMAILJS_TEMPLATE_ID: ${{ vars.EMAILJS_TEMPLATE_ID }}
          NEXT_PUBLIC_EMAILJS_PUBLIC_KEY: ${{ vars.EMAILJS_PUBLIC_KEY }}
          # Ancien réglage (Web3Forms), utilisé seulement si EmailJS n'est pas renseigné.
          NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY: ${{ vars.WEB3FORMS_ACCESS_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
